name: TORREMOLINOS static quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML, accessibility basics and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          src=Path('index.html').read_text('utf-8')
          assert '<!DOCTYPE html>' in src
          assert '<html lang="es">' in src
          assert 'TORREMOLINOS' in src
          assert 'lang="ru"' not in src  # content switched dynamically
          assert 'aria-label' in src
          assert 'https://www.renfe.com' in src
          assert '112' in src
          assert src.count('<script>') == 1
          scripts=re.findall(r'<script>(.*?)</script>',src,re.S)
          assert len(scripts)==1
          Path('/tmp/torremolinos.js').write_text(scripts[0],encoding='utf-8')
          class Parser(HTMLParser):
            def __init__(self): super().__init__();self.ids=[]
            def handle_starttag(self,tag,attrs):
              for key,value in attrs:
                if key=='id':self.ids.append(value)
          p=Parser();p.feed(src)
          assert len(p.ids)==len(set(p.ids)), 'Duplicate HTML IDs'
          stories=[
              'stories/index.html',
              'stories/torremolinos-mucho-mas-que-sol-y-playa.html',
              'stories/la-nogalera-donde-la-noche-tiene-historia.html',
              'stories/pasaje-begona-memoria-de-libertad.html',
              'stories/san-miguel-la-fiesta-que-saca-torremolinos-a-la-calle.html'
          ]
          for article in stories:
              html=Path(article).read_text('utf-8')
              assert '<!doctype html>' in html.lower(), article
              assert 'rel="canonical"' in html, article
              assert '<title>' in html and '<h1>' in html, article
              assert 'TORREMOLINOS' in html, article
              assert 'article.css' in html, article
              if article != 'stories/index.html':
                  assert 'Redacción TORREMOLINOS' in html, article
                  assert 'Fuentes y verificación' in html, article
          agenda=Path('agenda/index.html').read_text('utf-8')
          assert 'rel="canonical"' in agenda
          assert 'id="events"' in agenda
          assert 'id="watchlist"' in agenda
          assert 'app.js' in agenda and 'styles.css' in agenda
          assert 'torremolinosplus.com' in agenda
          assert 'agenda/' in src
          assert 'agenda/' in src
          assert Path('editorial.css').exists()
          photos=[
              'hero-torremolinos-desktop.webp',
              'hero-torremolinos-mobile.webp',
              'playa-palmeras-panorama.webp',
              'el-bajondillo-letrero.webp',
              'paseo-palmeras.webp',
              'mar-mediterraneo.webp',
              'costa-torremolinos.webp',
              'paseo-centro.webp'
          ]
          for file in photos:
              path=Path('assets/photos')/file
              assert path.is_file() and path.stat().st_size>1000, path
          assert 'hero-torremolinos-desktop.webp' in src
          assert 'hero-torremolinos-mobile.webp' in src

          assert Path('stories/article.css').exists()
          sitemap=Path('sitemap.xml').read_text('utf-8')
          for article in stories:
              loc='https://manzo8b.github.io/Torremolinos/'+article.replace('index.html','')
              assert loc in sitemap or article in sitemap, article
          assert 'https://manzo8b.github.io/Torremolinos/agenda/' in sitemap
          assert Path('comer/index.html').exists()
          assert Path('comer/data.js').exists()
          assert Path('comer/app.js').exists()
          assert Path('anteprima/index.html').exists()
          preview=Path('anteprima/index.html').read_text('utf-8')
          assert 'noindex,nofollow' in preview
          assert 'href="../comer/"' in preview
          assert 'href="../agenda/"' in preview
          import json,datetime
          feed=json.loads(Path('agenda/events.json').read_text('utf-8'))
          assert feed['schemaVersion']==1
          events=feed['events']
          assert len(events)>=27
          assert len({e['id'] for e in events})==len(events)
          for e in events:
              assert e['status']=='confirmed'
              assert e['start']<=e['end']
              datetime.date.fromisoformat(e['start'])
              datetime.date.fromisoformat(e['end'])
              assert e['source'].startswith('https://')
          assert any(e['id']=='madbear-beach-2027' for e in events)
          assert any(e['id']=='infinity-2027' for e in events)
          assert len([e for e in events if e['kind']=='lgbtq'])>=24
          assert any(e['id']=='navidaddys-20dec26' for e in events)
          assert any(x['id']=='daddy-week-2027' for x in feed['watchlist'])
          assert Path('agenda/scanner-baseline.json').exists()
          assert 'scanner-baseline.json' in Path('scripts/scan_events.py').read_text('utf-8')
          print('TORREMOLINOS: homepage, editorial pages and SEO checks passed')
          PY
          node --check /tmp/torremolinos.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check agenda/app.js
          node --check comer/data.js
          node --check comer/app.js
          python3 -m py_compile scripts/scan_events.py
          python3 scripts/scan_events.py --fixture-dir scripts/fixtures --out /tmp/torremolinos-scanner-fixtures --strict
          node --check listen/content.js
          node --check legal/data.js
          node --check legal/app.js
          python3 scripts/validate_v06.py
          
