name: TORREMOLINOS static quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML, accessibility basics and JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          src=Path('index.html').read_text('utf-8')
          assert '<!DOCTYPE html>' in src
          assert '<html lang="es">' in src
          assert 'TORREMOLINOS' in src
          assert 'lang="ru"' not in src  # content switched dynamically
          assert 'aria-label' in src
          assert 'https://www.renfe.com' in src
          assert '112' in src
          assert src.count('<script>') == 1
          scripts=re.findall(r'<script>(.*?)</script>',src,re.S)
          assert len(scripts)==1
          Path('/tmp/torremolinos.js').write_text(scripts[0],encoding='utf-8')
          class Parser(HTMLParser):
            def __init__(self): super().__init__();self.ids=[]
            def handle_starttag(self,tag,attrs):
              for key,value in attrs:
                if key=='id':self.ids.append(value)
          p=Parser();p.feed(src)
          assert len(p.ids)==len(set(p.ids)), 'Duplicate HTML IDs'
          stories=[
              'stories/index.html',
              'stories/torremolinos-mucho-mas-que-sol-y-playa.html',
              'stories/la-nogalera-donde-la-noche-tiene-historia.html',
              'stories/pasaje-begona-memoria-de-libertad.html'
          ]
          for article in stories:
              html=Path(article).read_text('utf-8')
              assert '<!doctype html>' in html.lower(), article
              assert 'rel="canonical"' in html, article
              assert '<title>' in html and '<h1>' in html, article
              assert 'TORREMOLINOS' in html, article
              assert 'article.css' in html, article
              if article != 'stories/index.html':
                  assert 'Redacción TORREMOLINOS' in html, article
                  assert 'Fuentes y verificación' in html, article
          assert Path('editorial.css').exists()
          assert Path('stories/article.css').exists()
          sitemap=Path('sitemap.xml').read_text('utf-8')
          for article in stories:
              loc='https://manzo8b.github.io/Torremolinos/'+article.replace('index.html','')
              assert loc in sitemap or article in sitemap, article
          print('TORREMOLINOS: homepage, editorial pages and SEO checks passed')
          PY
          node --check /tmp/torremolinos.js
          python3 -m json.tool manifest.webmanifest >/dev/null
