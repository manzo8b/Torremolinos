name: Generate optimized hero assets
on:
  push:
    branches:
      - design/apple-premium-narrative-2026-11
    paths:
      - '.github/workflows/generate-hero-assets.yml'
      - 'assets/photos/hero-apple-2026.svg'
      - 'assets/photos/hero-apple-2026-mobile.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-user-provided-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract lossless container's optimized WebP payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          for base in ('hero-apple-2026', 'hero-apple-2026-mobile'):
              svg=Path('assets/photos/'+base+'.svg').read_text(encoding='utf-8')
              result=re.search(r'href="data:image/webp;base64,([A-Za-z0-9+/=]+)"',svg)
              if not result:
                  raise ValueError(f'Missing encoded image: {base}')
              data=base64.b64decode(result.group(1),validate=True)
              if not data.startswith(b'RIFF') or data[8:12]!=b'WEBP':
                  raise ValueError(f'Not WebP: {base}')
              output=Path('assets/photos/'+base+'.webp')
              output.write_bytes(data)
              print(f'{output}: {len(data)} bytes')
          PY
      - name: Commit optimized binary photographs when permitted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/hero-apple-2026.webp assets/photos/hero-apple-2026-mobile.webp
          if git diff --cached --quiet; then
            echo "Binary photographs already present"
          else
            git commit -m "assets: materialize optimized hero WebP photographs"
            git push
          fi
