name: TORREMOLINOS — Fase 2 Content Coherence
on:
  pull_request:
    branches: [main]
    paths:
      - 'agenda/**'
      - 'comer/**'
      - 'gallery/**'
      - 'stories/**'
      - 'explore/la-nogalera/**'
      - 'tests/content-consistency-fase2e.test.mjs'
      - 'tests/fase2e-browser.mjs'
      - 'index.html'
      - 'approved-clean-2026.css'
      - 'service-worker.js'
      - 'tests/content-consistency-fase2.test.mjs'
      - 'tests/content-consistency-fase2b.test.mjs'
      - 'tests/content-consistency-fase2c.test.mjs'
      - 'tests/fase2c-browser.mjs'
      - 'scripts/audit_fase2c_i18n.mjs'
      - 'tests/fase2-content-browser.mjs'
      - 'tests/fase2b-browser.mjs'
      - '.github/workflows/content-coherence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editorial provenance and translations without accessing external websites
        run: node --test tests/content-consistency-fase2.test.mjs tests/content-consistency-fase2b.test.mjs tests/content-consistency-fase2c.test.mjs tests/content-consistency-fase2e.test.mjs
      - name: Audit Home and Gallery translation coverage without mother-tongue certification
        run: node scripts/audit_fase2c_i18n.mjs
      - name: Install Chromium test environment
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Check localized Agenda and Comer, provenance and responsive status
        run: node tests/fase2-content-browser.mjs
      - name: Check Gallery, Stories licensing and no-JS Comer in Chromium
        run: node tests/fase2b-browser.mjs
      - name: Verify La Nogalera source labels and dates in six languages
        run: node tests/fase2e-browser.mjs
      - name: Verify Essentials sources and enforce axe-core contrast gate
        run: node tests/fase2c-browser.mjs
      - name: Preserve editorial QA screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torremolinos-fase2-editorial-qa
          path: |
            artifacts/editorial-fase2/
            artifacts/editorial-fase2b/
            artifacts/editorial-fase2c/
            artifacts/editorial-fase2e/
          if-no-files-found: warn
          retention-days: 30
