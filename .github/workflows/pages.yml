name: Deploy TORREMOLINOS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Give the Actions artifact API time to index the uploaded github-pages artifact.
      # Prevents the observed 2026-11-24 metadata lookup race on the first deployment.
      - name: Wait for Pages artifact indexing
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
